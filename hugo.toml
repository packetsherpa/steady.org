baseURL = "https://steady.org/"
locale = "en-US"
title = "steady dot org"
timeZone = "America/New_York"
enableRobotsTXT = true
summaryLength = 36
theme = "PaperMod"

[params]
  env = "production"
  author = "Damien DeVille"
  description ="Damien DeVille on the records he keeps returning to and the shows he goes to see."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  mainSections = ["music"]
  images = ["images/og-default.jpg"]

  [params.cover]
    linkFullImages = true
    responsiveImages = false

  [params.homeInfoParams]
    Title = "Damien DeVille"
    Content = "Notes on listening. The records I keep coming back to, and the shows I go out to see. Technology writing moved to [Default Deny](https://packetsherpa.org/)."

  [[params.socialIcons]]
    name = "linkedin"
    title = "LinkedIn"
    url = "https://www.linkedin.com/in/ddeville/"
  [[params.socialIcons]]
    name = "threads"
    title = "Threads"
    url = "https://www.threads.com/@coldsho.e"
  [[params.socialIcons]]
    name = "rss"
    title = "RSS"
    url = "index.xml"

[taxonomies]
  category = "categories"
  tag = "tags"

[pagination]
  pagerSize = 12

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 30

[markup.highlight]
  codeFences = true
  guessSyntax = true
  noClasses = false

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[[menus.main]]
  name = "Music"
  pageRef = "/music"
  weight = 10

[[menus.main]]
  name = "Technology"
  url = "https://packetsherpa.org/"
  weight = 20

[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30
